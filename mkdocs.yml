site_name: Piper for Mere Mortals
site_description: A text to speech system that runs entirely on your own machine. Turning written text into spoken WAV files with downloadable neural voices, shaping how they sound with a handful of options, and proving the audio is real without sending a word to the cloud, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/piper-for-mere-mortals/
